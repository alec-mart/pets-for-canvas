<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pets for Canvas</title>
<meta name="description" content="A pet that lives in your Canvas. Chrome extension, free, open source, no login.">
<link rel="canonical" href="https://petsforcanvas.com/">
<link rel="icon" type="image/png" href="/site/img/icon-128.png">
<meta property="og:title" content="Pets for Canvas">
<meta property="og:description" content="A pet that lives in your Canvas. Chrome extension, free, open source, no login.">
<meta property="og:image" content="https://petsforcanvas.com/site/img/1-canvas.jpg">
<meta property="og:url" content="https://petsforcanvas.com/">
<meta name="twitter:card" content="summary_large_image">
<style>
@font-face{font-family:"Baloo 2";src:url("/site/img/baloo2.woff2") format("woff2");font-weight:400 800;font-display:swap}
@font-face{font-family:"Nunito";src:url("/site/img/nunito.woff2") format("woff2");font-weight:400 900;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Nunito",-apple-system,Segoe UI,sans-serif;color:#3E2A0C;background:radial-gradient(120% 110% at 30% 0%,#FFF3CE 0%,#FFD36B 48%,#F3B94A 100%) fixed;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:40px 20px 60px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header img{width:64px;height:64px;border-radius:16px;box-shadow:0 8px 20px rgba(120,80,10,.25)}
.mark{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:44px;line-height:1;color:#fff;text-shadow:0 4px 0 #B8791A,0 8px 20px rgba(120,80,10,.28)}
.mark small{font-size:22px;color:#7A4E08;text-shadow:0 2px 0 rgba(255,255,255,.35);margin-left:8px}
.hero{margin:48px 0 28px;text-align:center}
.hero h1{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:clamp(40px,7vw,84px);line-height:1.02;margin:0 0 22px;color:#fff;text-shadow:0 6px 0 #B8791A,0 14px 30px rgba(120,80,10,.3)}
.btn{display:inline-block;background:linear-gradient(180deg,#6EA0F5,#5B8DEF);color:#fff;text-decoration:none;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:24px;padding:14px 38px;border-radius:16px;border-bottom:5px solid #3E6CCB;box-shadow:0 10px 24px rgba(62,108,203,.3)}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.sub{margin:14px 0 0;font-weight:800;color:#7A4E08}
.sub a{color:#3E6CCB;text-decoration:underline}
.shots{display:grid;gap:22px;margin-top:40px}
.shots figure{margin:0;border-radius:20px;overflow:hidden;box-shadow:0 24px 50px rgba(120,80,10,.28),0 0 0 6px rgba(255,255,255,.6)}
.shots img{display:block;width:100%;height:auto}
footer{margin-top:48px;text-align:center;font-weight:800;color:#7A4E08}
footer a{color:#3E6CCB;text-decoration:none;margin:0 10px}
footer p{margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="/site/img/icon-128.png" alt="" width="64" height="64"><div class="mark">Pets<small>for Canvas</small></div></header>
  <section class="hero">
    <h1>A pet that lives in your Canvas</h1>
    <a class="btn" href="https://chromewebstore.google.com/detail/pets-for-canvas/cgmbkkaalodhmfadjcnolihhomgkdpbc">Install</a>
    <p class="sub">Chrome extension, free, <a href="https://github.com/alec-mart/pets-for-canvas">open source</a>, no login</p>
  </section>
  <section class="shots">
    <figure><img src="/site/img/1-canvas.jpg" alt="Pets live in your Canvas" width="1280" height="800" loading="eager"></figure>
    <figure><img src="/site/img/2-adopt.jpg" alt="Adopt new friends" width="1280" height="800" loading="lazy"></figure>
    <figure><img src="/site/img/3-dress.jpg" alt="Dress your friend" width="1280" height="800" loading="lazy"></figure>
    <figure><img src="/site/img/4-streak.jpg" alt="Keep your streak, earn coins" width="1280" height="800" loading="lazy"></figure>
    <figure><img src="/site/img/5-collect.jpg" alt="Collect them all" width="1280" height="800" loading="lazy"></figure>
  </section>
  <footer>
    <p><a href="https://github.com/alec-mart/pets-for-canvas">Open source</a><a href="/privacy">Privacy</a><a href="/support">Support</a></p>
    <p>Made by a student. Pets for Canvas™ is a trademark of Winston Digital LLC.</p>
  </footer>
</div>
</body>
</html>
