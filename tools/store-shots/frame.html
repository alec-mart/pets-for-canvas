<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: "Baloo 2"; src: url("ext/fonts/baloo2.woff2") format("woff2"); font-weight: 400 800; }
@font-face { font-family: "Nunito"; src: url("ext/fonts/nunito.woff2") format("woff2"); font-weight: 400 900; }
html,body{margin:0;width:1280px;height:800px;overflow:hidden}
body{position:relative;background:radial-gradient(120% 110% at 30% 0%, #C7DCFB 0%, #9DB9F8 45%, #6EA0F5 100%);font-family:"Baloo 2",sans-serif}
.ground{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(180deg,#AEDFAE,#7CC287)}
.hill{position:absolute;left:-10%;width:120%;height:220px;bottom:90px;border-radius:50% 50% 0 0;background:#BFE6BC;opacity:.9}
.hill.b{left:30%;width:90%;bottom:110px;height:160px;background:#CDEBC8}
.word{position:absolute;left:96px;top:190px;color:#fff;text-shadow:0 5px 0 #3E6CCB,0 10px 26px rgba(40,60,120,.35);font-weight:800;font-size:76px;line-height:.95;width:520px}
.word small{display:block;font-size:34px;color:#FFE9A8;text-shadow:0 3px 0 #9A5C05,0 6px 18px rgba(40,60,120,.35);margin-top:6px}
.tag{position:absolute;left:100px;top:372px;font-family:"Nunito",sans-serif;font-weight:800;font-size:30px;line-height:1.3;color:#fff;text-shadow:0 2px 0 rgba(62,108,203,.6);width:480px}
.win{position:absolute;right:120px;top:52px;width:360px;height:600px;transform:scale(1.16);transform-origin:top right;border-radius:22px;overflow:hidden;box-shadow:0 30px 60px rgba(30,50,110,.35),0 0 0 6px rgba(255,255,255,.55)}
.win iframe{width:360px;height:600px;border:0;display:block;background:#F1F3F9}
</style></head><body>
<div class="hill"></div><div class="hill b"></div><div class="ground"></div>
<div class="word" id="word"></div><div class="tag" id="tag"></div>
<div class="win"><iframe id="f"></iframe></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('f').src='ext/shot.html?state='+(q.get('state')||'home');
document.getElementById('word').innerHTML=q.get('h')||'';
document.getElementById('tag').textContent=q.get('t')||'';
</script></body></html>
