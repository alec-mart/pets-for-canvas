<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: "Baloo 2"; src: url("ext/fonts/baloo2.woff2") format("woff2"); font-weight: 400 800; }
@font-face { font-family: "Nunito"; src: url("ext/fonts/nunito.woff2") format("woff2"); font-weight: 400 900; }
html,body{margin:0;width:1280px;height:800px;overflow:hidden}
body{position:relative;background:radial-gradient(120% 110% at 30% 0%, #C7DCFB 0%, #9DB9F8 45%, #6EA0F5 100%);font-family:"Baloo 2",sans-serif}
.ground{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(180deg,#AEDFAE,#7CC287)}
.hill{position:absolute;left:-10%;width:120%;height:220px;bottom:90px;border-radius:50% 50% 0 0;background:#BFE6BC;opacity:.9}
.hill.b{left:30%;width:90%;bottom:110px;height:160px;background:#CDEBC8}
.word{position:absolute;left:96px;top:150px;color:#fff;text-shadow:0 5px 0 #3E6CCB,0 10px 26px rgba(40,60,120,.35);font-weight:800;font-size:76px;line-height:.95;width:420px}
.word small{display:block;font-size:34px;color:#FFE9A8;text-shadow:0 3px 0 #9A5C05,0 6px 18px rgba(40,60,120,.35);margin-top:6px}
.tag{position:absolute;left:100px;top:332px;font-family:"Nunito",sans-serif;font-weight:800;font-size:30px;line-height:1.3;color:#fff;text-shadow:0 2px 0 rgba(62,108,203,.6);width:380px}
.win{position:absolute;right:56px;top:96px;width:760px;height:509px;border-radius:18px;overflow:hidden;box-shadow:0 30px 60px rgba(30,50,110,.35),0 0 0 6px rgba(255,255,255,.55);background:#fff}
.win .shot{overflow:hidden;position:absolute;top:34px;left:0;right:0;bottom:0} .win img{width:1456px;height:829px;display:block;position:absolute;left:-390px;top:-290px}
.bar{height:34px;background:#F1F3F9;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid #DDE3F0}
.bar i{width:12px;height:12px;border-radius:50%;background:#D9DFEA;display:block}
.win .shot{position:absolute;top:34px;left:0;right:0;bottom:0}

</style></head><body>
<div class="hill"></div><div class="hill b"></div><div class="ground"></div>
<div class="word">Pets<small>for Canvas</small></div><div class="tag" id="tag"></div>
<div class="win"><div class="bar"><i></i><i></i><i></i></div><div class="shot"><img src="page.jpg"></div></div>
<script>document.getElementById('tag').textContent=new URLSearchParams(location.search).get('t')||'';</script>
</body></html>
