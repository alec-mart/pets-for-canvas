<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Baloo 2";src:url("ext/fonts/baloo2.woff2") format("woff2");font-weight:400 800}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:radial-gradient(120% 110% at 30% 0%,#B9D2FB 0%,#7FAAF6 45%,#5B8DEF 100%);font-family:"Baloo 2",sans-serif}
.word{position:absolute;left:60px;top:60px;color:#fff;text-shadow:0 8px 0 #3E6CCB,0 16px 30px rgba(30,60,130,.32);font-weight:800;font-size:132px;line-height:.9}
.word small{display:block;font-size:52px;color:#FFE08A;text-shadow:0 3px 0 rgba(30,60,130,.35);margin-top:8px}
.tag{position:absolute;left:64px;top:330px;font-size:40px;font-weight:800;color:#fff;text-shadow:0 3px 0 #3E6CCB}
.pets svg{position:absolute;overflow:visible;filter:drop-shadow(0 18px 16px rgba(30,60,130,.3))}
.pets .pup{left:600px;top:80px;width:520px;height:520px}
.pets .cat{left:930px;top:180px;width:420px;height:420px}
.cd-zzz,.cd-mouth-sad,.cd-mouth-open,.cd-lids{opacity:0}
</style></head><body><div class="word">Pets<small>for Canvas</small></div><div class="tag">A pet that lives in your Canvas</div><div class="pets"></div>
<script src="ext/collar-engine.js"></script><script>
const st=document.createElement('style');st.textContent=COLLAR_FX_CSS;document.head.appendChild(st);
const SP={pup:["art/winston-rig.svg","translate(-4.25,-4.2) scale(0.1088)","gold"],cat:["art/cat-rig.svg","translate(-4.9,-3.6) scale(0.1066)","aurora"]};
(async()=>{const pets=document.querySelector('.pets');for(const [k,[file,tr,collar]] of Object.entries(SP)){const txt=await (await fetch('ext/'+file)).text();const inner=txt.replace(/^[\s\S]*?<svg[^>]*>/,'').replace(/<\/svg>\s*$/,'');const w=document.createElement('div');w.innerHTML=`<svg class="${k}" viewBox="0 0 100 100"><g transform="${tr}">${inner}</g></svg>`;const svg=w.firstChild;pets.appendChild(svg);applyCollarDef(svg,COLLAR_DEFS.find(d=>d.id===collar),'o'+k);}})();
</script></body></html>
